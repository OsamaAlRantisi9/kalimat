<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalimat · Arabic vocabulary flashcards</title>
    <meta name="description" content="Learn Levantine (Ammiyeh) and Modern Standard Arabic (FusHa) words with flashcards, pronunciation and spaced repetition." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" />
    <script>
      // Apply the learner's saved theme before the first paint, so the page never flashes the wrong colors.
      // src/hooks/useTheme.js reads and writes the same key.
      try {
        const saved = localStorage.getItem('kalimat-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
